<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome 2026!</title>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-mid: #16213e;
            --bg-gradient-end: #0f3460;
            --bubble-1: #d4af37;
            --bubble-2: #c9a961;
            --bubble-3: #b8956a;
            --bubble-4: #8b7355;
            --bubble-5: #e6d5b8;
            --bubble-6: #f0e6d2;
            --text-color: #f5f5f5;
            --accent-gold: #d4af37;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 50%, var(--bg-gradient-end) 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .year-container {
            position: relative;
            height: 200px;
            margin-bottom: 30px;
        }

        .year {
            font-family: 'Righteous', cursive;
            font-size: 120px;
            font-weight: bold;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            letter-spacing: 8px;
        }

        .year-2025 {
            color: #c9a961;
            animation: fadeOut 3s ease-in-out forwards;
            animation-delay: 2s;
            text-shadow: 0 2px 10px rgba(201, 169, 97, 0.3);
        }

        .year-2026 {
            color: var(--accent-gold);
            opacity: 0;
            animation: fadeIn 2s ease-in-out forwards;
            animation-delay: 4s;
            text-shadow: 0 2px 15px rgba(212, 175, 55, 0.4);
        }

        .message {
            font-size: 32px;
            color: var(--text-color);
            opacity: 0;
            animation: messageAppear 1.5s ease-in-out forwards;
            animation-delay: 5.5s;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        /* Letter Section */
        .letter-section {
            position: fixed;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 650px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(245, 245, 245, 0.95));
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
            animation: slideUp 1s ease-out forwards;
            animation-delay: 6.5s;
            z-index: 100;
            border: 2px solid rgba(212, 175, 55, 0.3);
        }

        @keyframes slideUp {
            to {
                bottom: 30px;
            }
        }

        .letter-section h2 {
            font-family: 'Righteous', cursive;
            font-size: 26px;
            color: #1a1a2e;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent-gold);
            padding-bottom: 15px;
        }

        .letter-content {
            font-family: 'Georgia', serif;
            font-size: 17px;
            line-height: 1.8;
            color: #2c3e50;
            text-align: justify;
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 10px;
            border-left: 4px solid var(--accent-gold);
            font-style: italic;
        }

        .letter-input {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border: 2px solid #d4af37;
            border-radius: 10px;
            font-family: 'Georgia', serif;
            font-size: 16px;
            resize: vertical;
            outline: none;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
            color: #2c3e50;
        }

        .letter-input:focus {
            border-color: #b8956a;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .btn-save {
            background: linear-gradient(135deg, #d4af37, #c9a961);
            color: white;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.3);
        }

        .btn-close {
            background: linear-gradient(135deg, #8b7355, #b8956a);
            color: white;
        }

        .btn-close:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 115, 85, 0.3);
        }

        .saved-message {
            text-align: center;
            color: #2c7a2c;
            font-weight: 700;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .saved-message.show {
            opacity: 1;
        }

        @keyframes fadeOut {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
            }
            30% {
                opacity: 0.8;
                transform: translate(-50%, -50%) scale(1.2) rotate(5deg);
            }
            60% {
                opacity: 0.4;
                transform: translate(-50%, -50%) scale(0.8) rotate(-5deg);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -150%) scale(0.3) rotate(0deg);
                filter: blur(10px);
            }
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translate(-50%, 150%) scale(0.3);
                filter: blur(10px);
            }
            30% {
                opacity: 0.5;
                transform: translate(-50%, -50%) scale(1.3);
                filter: blur(5px);
            }
            60% {
                opacity: 0.8;
                transform: translate(-50%, -50%) scale(0.9);
                filter: blur(0px);
            }
            80% {
                transform: translate(-50%, -50%) scale(1.05);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
                filter: blur(0px);
            }
        }

        @keyframes messageAppear {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Bubble styles */
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.3), transparent 50%);
            backdrop-filter: blur(5px);
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.2),
                        0 8px 32px rgba(0, 0, 0, 0.1);
            animation: float linear infinite;
            opacity: 0;
        }

        .bubble::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 10%;
            width: 40%;
            height: 40%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.6), transparent);
            border-radius: 50%;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }

        @keyframes floatSideways {
            0% {
                transform: translateY(100vh) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            50% {
                transform: translateY(50vh) translateX(var(--drift)) scale(1);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-20vh) translateX(calc(var(--drift) * 1.5)) scale(1);
                opacity: 0;
            }
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0;
            animation: confettiFall 3s ease-in forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Sparkle effect */
        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: sparkleAnimation 2s ease-in-out infinite;
        }

        @keyframes sparkleAnimation {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Letter bubbles */
        .letter-bubble {
            position: absolute;
            font-family: 'Righteous', cursive;
            font-size: 48px;
            font-weight: bold;
            color: white;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.3),
                        0 8px 32px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            animation: floatSideways linear infinite;
            opacity: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="year-container">
            <div class="year year-2025">2025</div>
            <div class="year year-2026">2026</div>
        </div>
        <div class="message">Happy New Year! ✨</div>
    </div>

    <div class="letter-section">
        <h2>📜 A New Year Message</h2>
        <div class="letter-content">
            December is closing its chapter, and a new year is opening softly. Wishing you peace, good health, and moments that make you smile. Happy New Year.
        </div>
        <textarea 
            class="letter-input" 
            placeholder="Write your own wishes and reflections for 2026..."
            id="letterInput"
        ></textarea>
        <div class="button-group">
            <button class="btn btn-save" onclick="saveLetter()">💾 Save Your Message</button>
            <button class="btn btn-close" onclick="closeLetter()">✕ Close</button>
        </div>
        <div class="saved-message" id="savedMessage">✅ Your message has been saved!</div>
    </div>

    <script>
        // Create regular bubbles
        function createBubble() {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            
            const size = Math.random() * 80 + 40;
            const colors = [
                'rgba(212, 175, 55, 0.15)',
                'rgba(201, 169, 97, 0.15)',
                'rgba(184, 149, 106, 0.15)',
                'rgba(139, 115, 85, 0.15)',
                'rgba(230, 213, 184, 0.15)',
                'rgba(240, 230, 210, 0.15)'
            ];
            
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${Math.random() * 100}%`;
            bubble.style.background = `radial-gradient(circle at 30% 30%, ${color}, transparent 70%)`;
            bubble.style.border = `1px solid ${color}`;
            bubble.style.animationDuration = `${Math.random() * 8 + 6}s`;
            bubble.style.animationDelay = `${Math.random() * 5}s`;
            
            document.body.appendChild(bubble);
            
            setTimeout(() => {
                bubble.remove();
            }, 15000);
        }

        // Create letter bubbles
        function createLetterBubble(letter, delay) {
            const bubble = document.createElement('div');
            bubble.classList.add('letter-bubble');
            bubble.textContent = letter;
            
            const colors = [
                'rgba(212, 175, 55, 0.2)',
                'rgba(201, 169, 97, 0.2)',
                'rgba(184, 149, 106, 0.2)',
                'rgba(139, 115, 85, 0.2)',
                'rgba(230, 213, 184, 0.2)',
                'rgba(240, 230, 210, 0.2)'
            ];
            
            const color = colors[Math.floor(Math.random() * colors.length)];
            const drift = (Math.random() - 0.5) * 200;
            
            bubble.style.left = `${Math.random() * 80 + 10}%`;
            bubble.style.setProperty('--drift', `${drift}px`);
            bubble.style.background = `radial-gradient(circle at 30% 30%, ${color}, transparent 70%)`;
            bubble.style.border = `2px solid ${color}`;
            bubble.style.animationDuration = `${Math.random() * 4 + 8}s`;
            bubble.style.animationDelay = `${delay}s`;
            
            document.body.appendChild(bubble);
            
            setTimeout(() => {
                bubble.remove();
            }, 15000);
        }

        // Create confetti
        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            
            const colors = [
                '#d4af37',
                '#c9a961',
                '#b8956a',
                '#8b7355',
                '#e6d5b8',
                '#f0e6d2'
            ];
            
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            confetti.style.left = `${Math.random() * 100}%`;
            confetti.style.top = '-50px';
            confetti.style.background = color;
            confetti.style.animationDelay = `${Math.random() * 2}s`;
            confetti.style.animationDuration = `${Math.random() * 2 + 2}s`;
            
            document.body.appendChild(confetti);
            
            setTimeout(() => {
                confetti.remove();
            }, 5000);
        }

        // Create sparkles
        function createSparkle() {
            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            
            sparkle.style.left = `${Math.random() * 100}%`;
            sparkle.style.top = `${Math.random() * 100}%`;
            sparkle.style.animationDelay = `${Math.random() * 2}s`;
            
            document.body.appendChild(sparkle);
            
            setTimeout(() => {
                sparkle.remove();
            }, 4000);
        }

        // Initialize animations
        function init() {
            // Create regular bubbles continuously
            setInterval(createBubble, 400);
            
            // Create letter bubbles for "2026"
            const letters = ['2', '0', '2', '6'];
            letters.forEach((letter, index) => {
                // Create multiple instances of each letter at different times
                setTimeout(() => createLetterBubble(letter, 0), index * 300);
                setTimeout(() => createLetterBubble(letter, 0), index * 300 + 2000);
                setTimeout(() => createLetterBubble(letter, 0), index * 300 + 4000);
            });
            
            // Start confetti after 4 seconds (when 2026 appears)
            setTimeout(() => {
                setInterval(createConfetti, 100);
            }, 4000);
            
            // Stop confetti after 7 seconds
            setTimeout(() => {
                // Reduce confetti frequency
            }, 7000);
            
            // Create sparkles
            setInterval(createSparkle, 200);
        }

        // Start when page loads
        window.addEventListener('load', init);

        // Letter section functions
        function saveLetter() {
            const letterInput = document.getElementById('letterInput');
            const savedMessage = document.getElementById('savedMessage');
            const text = letterInput.value.trim();
            
            if (text) {
                // Save to localStorage
                localStorage.setItem('new_year_2026_letter', text);
                localStorage.setItem('new_year_2026_date', new Date().toLocaleString());
                
                // Show saved message
                savedMessage.classList.add('show');
                
                // Create celebration burst
                for (let i = 0; i < 30; i++) {
                    setTimeout(() => createConfetti(), i * 50);
                }
                
                setTimeout(() => {
                    savedMessage.classList.remove('show');
                }, 3000);
            } else {
                alert('Please write something first! 😊');
            }
        }

        function closeLetter() {
            const letterSection = document.querySelector('.letter-section');
            letterSection.style.animation = 'slideDown 0.5s ease-in forwards';
            
            setTimeout(() => {
                letterSection.style.display = 'none';
            }, 500);
        }

        // Load saved letter on page load
        window.addEventListener('load', () => {
            const savedLetter = localStorage.getItem('new_year_2026_letter');
            if (savedLetter) {
                document.getElementById('letterInput').value = savedLetter;
            }
        });

        // Add slideDown animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideDown {
                to {
                    bottom: -100%;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
